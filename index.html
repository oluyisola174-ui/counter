<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="count">counter</h1>
    <section class="container">
    <div id="counter" class="counter">0</div>
    <button id="increase" onclick="increaseCounter()">+</button>
    <button id="decrease" onclick="decreaseCounter()">-</button>
    <button id="reset" onclick="resetCounter()">reset</button>
    <button id="save" onclick="saveCounter()">save</button>
    <button id="load" onclick="loadCounter()">load</button>
    </section>
</body>
<script src="script.js"></script>
</html>
